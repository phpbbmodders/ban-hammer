services:
    phpbbmodders.banhammer.listener:
        class: phpbbmodders\banhammer\event\banhammer_listener
        arguments:
            - '@auth'
            - '@cache.driver'
            - '@config'
            - '@dbal.conn'
            - '@controller.helper'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbmodders.banhammer.core.bantime'
            - '@phpbbmodders.banhammer.core.ban_helper'
            - '@phpbbmodders.banhammer.core.ban_group_restore'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@service_container'
            - '%core.table_prefix%banhammer_restrict'
            - '%core.table_prefix%banhammer_ban_group'
        tags:
            - { name: event.listener }
    phpbbmodders.banhammer.admin.controller:
        class: phpbbmodders\banhammer\controller\admin_controller
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@phpbbmodders.banhammer.core.bantime'
    phpbbmodders.banhammer.core.bantime:
        class:  phpbbmodders\banhammer\core\bantime
        arguments:
            - '@user'
    phpbbmodders.banhammer.core.ban_helper:
        class: phpbbmodders\banhammer\core\ban_helper
        arguments:
            - '@service_container'
            - '%core.root_path%'
            - '%core.php_ext%'
    phpbbmodders.banhammer.core.ban_group_restore:
        class: phpbbmodders\banhammer\core\ban_group_restore
        arguments:
            - '@dbal.conn'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%banhammer_restrict'
            - '%core.table_prefix%banhammer_ban_group'
    phpbbmodders.banhammer.controller.ban_domain:
        class: phpbbmodders\banhammer\controller\ban_domain_controller
        arguments:
            - '@auth'
            - '@language'
            - '@request'
            - '@user'
            - '@phpbbmodders.banhammer.core.ban_helper'
    phpbbmodders.banhammer.cron.restriction_expiry:
        class: phpbbmodders\banhammer\cron\task\restriction_expiry
        arguments:
            - '@config'
            - '@dbal.conn'
            - '%core.table_prefix%banhammer_restrict'
            - '%core.root_path%'
            - '%core.php_ext%'
        calls:
            - [set_name, [cron.task.phpbbmodders.banhammer.restriction_expiry]]
        tags:
            - { name: cron.task }
    phpbbmodders.banhammer.cron.ban_group_restore:
        class: phpbbmodders\banhammer\cron\task\ban_group_restore
        arguments:
            - '@config'
            - '@phpbbmodders.banhammer.core.ban_group_restore'
        calls:
            - [set_name, [cron.task.phpbbmodders.banhammer.ban_group_restore]]
        tags:
            - { name: cron.task }
